<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroLab Educativa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background-color: #ff0000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ElectroLab Educativa</h1>
    <p>Sitio oficial en construcción. Divulgación y enseñanza sobre electrónica, robótica y programación.</p>
    <a class="btn" href="https://www.youtube.com/@ElectroLabEducativa" target="_blank">Visitar canal de YouTube</a>
  </div>
</body>
</html>
